version: 1
name: bergpark
description: Bergpark Wilhelmshöhe bilingual visitor guide PWA
agent:
  notes: Preserve runtime JSON graph compatibility. Keep the map usable without GPS, and cache only tiles actually viewed by the visitor; do not bulk-prefetch OSM.
  tasks:
    - Expose general visitor multi-hop routing over the bounded Phase-8 topology without overstating physical coverage or accessibility evidence.
    - Complete bilingual editorial/source-freshness gates and beta Firefox/iOS Safari qualification.
commands:
  test:
    run: ["pnpm", "run", "test"]
    category: test
  build:
    run: ["pnpm", "run", "build"]
    category: build
  check:
    run: ["pnpm", "run", "check"]
    category: custom
  dev:
    run: ["pnpm", "exec", "vite", "--host", "127.0.0.1"]
    category: dev
