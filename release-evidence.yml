changes_since_public_alpha2:
  summary:
    - Graph Phase 8 walking topology expanded to 2633 path nodes and 7196 directed segments over 955 bounded preserved OSM ways.
    - Runtime data publication/load/precache converged on an 11-layer manifest contract with artifact budgets and fail-closed schema handling.
    - Visitor routing gained bounded multi-hop planning, DGM1 route elevation evidence, source/access caveats and route-detail hydration hardening.
    - Visitor discovery expanded across places, semantic entities, trees, visitor features and bounded walking-network context.
    - Optional MapLibre terrain and shared-depth Three.js heritage rendering landed while Leaflet remained the default compatibility/low-power path.
    - PWA offline/upgrade behavior, GPS proximity, reduced-motion/focus behavior, keyboard access and runtime evidence links were hardened.
    - Nature-first companion journeys, bilingual transcripts/narration and almanac walking-network discovery landed after the first rc.1 snapshot.
  post_2026_09_01_candidate_source_changes:
    - e104e6707af278a7e680cd6fce7f02232741ce65  # model-viewer cleanup/context-retention hardening
    - 7f43662dbe84b43077be9aa4d63b26b0ff4b2049  # companion journey hardening
    - ba242d9b46150b83a140d9b44d64113e60622046  # walking network in almanac
    - e4cd01fc98a3f85161dfb33f699c25a96a8b0254  # preserve narration state on hydration

verification:
  repository_gate:
    command: pnpm run check
    revision: e4cd01fc98a3f85161dfb33f699c25a96a8b0254
    result: pass
    lint: pass
    node_tests: 126/126
    vitest_tests: 2/2
    python_tests: 87/87
    vite_build: pass
    runtime_artifact_check: pass
  initial_chromium_release_matrix:
    command: pnpm run test:e2e
    revision: e4cd01fc98a3f85161dfb33f699c25a96a8b0254
    workers: 2
    result: fail
    tests: 54/60
    duration: 4.6m
    interpretation: The stale September 1 candidate evidence did not survive requalification after later application changes; failures clustered in MapLibre/Three/narration startup and timing paths.
  post_selector_chromium_release_matrix:
    command: pnpm run test:e2e
    test_harness_revision: e303b5187cc756d4b2673195d12ca29f64236748
    workers: 2
    result: fail
    tests: 59/60
    repeated_non_green: true
    independent_runs:
      - result: 59/60
        failing_case: narration hydration race
        isolated_case: pass
      - result: 59/60
        failing_case: terrain/shared-depth recovery timeout
        isolated_case: pass_in_serial_diagnostic
    interpretation: Failure location is timing-sensitive across configured runs, so the release matrix is flaky/non-green rather than a stable RC gate.
  bilingual_browser_smoke:
    command: pnpm exec playwright test tests/e2e/visitor-guide.spec.js tests/e2e/companion-guide.spec.js tests/e2e/phase6-integration.spec.js --grep 'switch language|bilingual transcripts|switches language' --workers=1
    revision: e4cd01fc98a3f85161dfb33f699c25a96a8b0254
    result: pass
    tests: 3/3
    evidence:
      - DE-to-EN visitor UI switch and route/search flow renders correctly.
      - DE/EN transcript selection renders correctly.
      - Semantic artwork detail remains linked and localized across language switch.
  failed_browser_slice_diagnostic:
    command: pnpm exec playwright test <six previously failing locations> --workers=1
    test_harness_revision: e303b5187cc756d4b2673195d12ca29f64236748
    result: pass
    tests: 6/6
    interpretation: The configured failures are concurrency/resource-sensitive rather than six deterministic feature regressions, but this serial diagnostic does not replace the configured release gate.
  isolated_dedicated_preview_matrix:
    command: BERGPARK_E2E_BASE_URL=http://127.0.0.1:4175 pnpm run test:e2e
    workers: 2
    result: fail
    tests: 58/60
    tested_worktree_later_committed_as: af679cb587ac725b966fa7021e407cbf3a2c4fda
    isolation: dedicated Vite preview port avoided shared Playwright webServer lifecycle races
    failures:
      - tests/e2e/phase2-search.spec.js:15 touch-target boundingBox transiently returned null/0 after visible result
      - tests/e2e/phase3-motion-focus.spec.js:43 close-detail focus assertion did not stabilize
    repeat_diagnostics:
      - case: tests/e2e/phase2-search.spec.js:15
        command: same dedicated preview, workers=2, repeat-each=3
        result: 3/3 pass
      - case: tests/e2e/phase3-motion-focus.spec.js:43
        command: same dedicated preview, workers=2, repeat-each=3
        result: 3/3 pass
    interpretation: Dedicated-server qualification still remains non-green; failure locations move and pass repeated isolation, confirming a flaky release gate rather than a clean RC candidate.
  post_reconciliation_build:
    command: pnpm run build && pnpm run check:runtime-artifact
    revision: f65b2c1878a6c741613d1762401976e8bb8c0f73
    result: pass
