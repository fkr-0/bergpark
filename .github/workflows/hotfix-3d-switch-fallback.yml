name: Stage 3D switch fallback hotfix
on:
  push:
    branches: [hotfix/3d-switch-fallback]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-python.txt
      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.3.0
      - name: Install
        run: |
          python -m pip install --requirement requirements-python.txt
          pnpm install --frozen-lockfile
      - name: Patch
        run: python scripts/_hotfix_3d_switch.py
      - name: Deterministic gates
        run: pnpm run check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Renderer integration
        env:
          BERGPARK_E2E_WORKERS: '1'
        run: pnpm exec playwright test tests/e2e/spatial-product-integration.spec.js
      - name: Commit clean tree
        run: |
          rm scripts/_hotfix_3d_switch.py .github/workflows/hotfix-3d-switch-fallback.yml
          git config user.name fkr-0
          git config user.email 26308101+fkr-0@users.noreply.github.com
          git add -A src/main.js src/i18n.js tests/e2e/spatial-product-integration.spec.js scripts/_hotfix_3d_switch.py .github/workflows/hotfix-3d-switch-fallback.yml
          git commit -m 'fix: make 3d renderer fallback explicit'
          git push origin HEAD:hotfix/3d-switch-fallback
