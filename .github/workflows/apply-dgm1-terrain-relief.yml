name: Apply DGM1 terrain relief patch

on:
  push:
    branches:
      - 'fix/dgm1-terrain-relief'
    paths:
      - '.github/workflows/apply-dgm1-terrain-relief.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: 'fix/dgm1-terrain-relief'
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_dgm1_relief_patch.py
      - name: Syntax checks
        run: |
          node --check src/maplibre-map.js
          node --check tests/e2e/terrain-relief-regression.spec.js
      - name: Commit patched product
        run: |
          git rm .github/workflows/apply-dgm1-terrain-relief.yml scripts/apply_dgm1_relief_patch.py
          git config user.name 'bergpark-ci'
          git config user.email '26308101+fkr-0@users.noreply.github.com'
          git add src/maplibre-map.js tests/terrain-relief-guard.test.mjs tests/e2e/terrain-relief-regression.spec.js docs/evidence/cascades-side-view-flat-terrain-2026-09-01.md
          git commit -m 'fix: verify and restore DGM1 terrain relief'
          git push origin HEAD:fix/dgm1-terrain-relief
