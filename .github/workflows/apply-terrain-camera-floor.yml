name: Apply terrain camera floor

on:
  push:
    branches:
      - fix/terrain-camera-floor

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'bergpark-ci'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/terrain-camera-floor
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-python.txt
      - name: Install dependencies
        run: |
          corepack enable
          corepack install --global pnpm@11.3.0
          python -m pip install --requirement requirements-python.txt
          pnpm install --frozen-lockfile
      - name: Apply camera-floor contract
        run: python scripts/apply-terrain-camera-floor.py
      - name: Validate deterministic terrain contracts
        run: |
          python terrain/pipeline/maplibre_dem.py validate
          node --test tests/maplibre-terrain.test.mjs tests/terrain-relief-guard.test.mjs tests/terrain-runtime-lifecycle.test.mjs
          python -m unittest tests.test_maplibre_dem
          pnpm exec biome check src/maplibre-map.js tests/e2e/phase4-maplibre-terrain.spec.js tests/maplibre-terrain.test.mjs
      - name: Build browser candidate
        run: pnpm run build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Focused terrain browser acceptance
        run: pnpm exec playwright test tests/e2e/terrain-relief-regression.spec.js tests/e2e/phase4-maplibre-terrain.spec.js --project=chromium
      - name: Commit product patch
        run: |
          rm scripts/apply-terrain-camera-floor.py .github/workflows/apply-terrain-camera-floor.yml
          git config user.name bergpark-ci
          git config user.email 26308101+fkr-0@users.noreply.github.com
          git add src/maplibre-map.js terrain/pipeline/maplibre_dem.py public/terrain/dgm1-terrarium/manifest.json terrain/README.md reimagined.md tests/e2e/phase4-maplibre-terrain.spec.js tests/maplibre-terrain.test.mjs tests/test_maplibre_dem.py scripts/apply-terrain-camera-floor.py .github/workflows/apply-terrain-camera-floor.yml
          git diff --cached --check
          git commit -m "fix: align terrain camera with DEM parent level"
          git push origin HEAD:fix/terrain-camera-floor
