name: Diagnose deployed 3D switch in Firefox

on:
  push:
    branches:
      - diag/production-firefox-3d

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.3.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Firefox
        run: pnpm exec playwright install --with-deps firefox
      - name: Create production Firefox diagnostic
        run: |
          cat > playwright.production-firefox.config.js <<'EOF'
          import { defineConfig, devices } from '@playwright/test';
          export default defineConfig({
            testDir: './tests/e2e',
            timeout: 60_000,
            workers: 1,
            reporter: 'line',
            use: {
              baseURL: 'https://bergpark.fkr.dev',
              trace: 'retain-on-failure',
              screenshot: 'only-on-failure',
              video: 'retain-on-failure',
              serviceWorkers: 'allow',
            },
            projects: [{ name: 'firefox', use: { ...devices['Desktop Firefox'] } }],
          });
          EOF
          cat > tests/e2e/production-firefox-3d.diag.spec.js <<'EOF'
          import { expect, test } from '@playwright/test';
          import { stubThirdPartyMapTiles } from './test-support.js';

          test('deployed Leaflet to terrain switch', async ({ page }) => {
            const messages = [];
            page.on('console', (message) => messages.push(`console:${message.type()}:${message.text()}`));
            page.on('pageerror', (error) => messages.push(`pageerror:${error.message}`));
            page.on('requestfailed', (request) => messages.push(`requestfailed:${request.url()}:${request.failure()?.errorText ?? 'unknown'}`));
            await stubThirdPartyMapTiles(page);
            await page.goto('/#place=herkules', { waitUntil: 'domcontentloaded' });
            const map = page.locator('#map');
            const button = page.locator('#renderer-switch');
            await expect(map).toHaveAttribute('data-spatial-renderer', 'leaflet');
            await expect(button).toBeVisible();
            const snapshot = () => page.evaluate(() => {
              const mapElement = document.querySelector('#map');
              const switchElement = document.querySelector('#renderer-switch');
              const probe = document.createElement('canvas');
              let webgl2 = false;
              try { webgl2 = Boolean(probe.getContext('webgl2')); } catch {}
              return {
                href: location.href,
                renderer: mapElement?.dataset.spatialRenderer ?? null,
                preference: mapElement?.dataset.spatialPreference ?? null,
                fallback: mapElement?.dataset.spatialFallbackReason ?? null,
                terrainReady: mapElement?.dataset.spatialTerrainReady ?? null,
                disabled: switchElement?.disabled ?? null,
                buttonText: switchElement?.textContent ?? null,
                webgl2,
                ua: navigator.userAgent,
              };
            });
            console.log('BPK3D before', JSON.stringify(await snapshot()));
            await button.click();
            for (const delay of [500, 2000, 5000, 10000, 15000]) {
              await page.waitForTimeout(delay === 500 ? 500 : delay - (delay === 2000 ? 500 : delay === 5000 ? 2000 : delay === 10000 ? 5000 : 10000));
              console.log(`BPK3D after-${delay}`, JSON.stringify(await snapshot()));
            }
            console.log('BPK3D messages', JSON.stringify(messages));
            await expect(map).toHaveAttribute('data-spatial-renderer', 'terrain', { timeout: 2_000 });
          });
          EOF
      - name: Run deployed Firefox diagnostic
        run: pnpm exec playwright test production-firefox-3d.diag.spec.js --config=playwright.production-firefox.config.js
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-firefox-3d-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
