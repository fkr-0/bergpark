name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.3.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-python.txt

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-python.txt
          pnpm install --frozen-lockfile

      - name: Unit, data-integrity and production-build gates
        run: pnpm run check

      - name: Install Chromium for browser E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E and accessibility smoke
        run: pnpm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ci-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
