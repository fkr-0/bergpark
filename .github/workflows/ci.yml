name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Unit, data-integrity and production-build gates
        run: npm run check

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E and accessibility smoke
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ci-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
