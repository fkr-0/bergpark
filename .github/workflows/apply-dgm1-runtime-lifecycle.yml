name: Apply DGM1 terrain runtime lifecycle fix

on:
  push:
    branches: [fix/dgm1-terrain-runtime-lifecycle]
    paths: [.github/workflows/apply-dgm1-runtime-lifecycle.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/dgm1-terrain-runtime-lifecycle
          fetch-depth: 0
      - name: Enable pnpm and install dependencies
        run: |
          corepack enable
          corepack install --global pnpm@11.3.0
          pnpm install --frozen-lockfile
      - name: Apply patch
        run: python scripts/apply-dgm1-runtime-lifecycle.py
      - name: Focused syntax and unit checks
        run: |
          node --check src/maplibre-map.js
          node --check tests/e2e/terrain-relief-regression.spec.js
          node --test tests/terrain-relief-guard.test.mjs tests/terrain-runtime-lifecycle.test.mjs
      - name: Commit patched product
        run: |
          git rm .github/workflows/apply-dgm1-runtime-lifecycle.yml scripts/apply-dgm1-runtime-lifecycle.py
          git config user.name 'bergpark-ci'
          git config user.email '26308101+fkr-0@users.noreply.github.com'
          git add src/maplibre-map.js tests/e2e/terrain-relief-regression.spec.js tests/terrain-runtime-lifecycle.test.mjs
          git commit -m 'fix: stabilize DGM1 terrain activation and qualification'
          git push origin HEAD:fix/dgm1-terrain-runtime-lifecycle
